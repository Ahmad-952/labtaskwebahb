<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form id="studentForm">

            <label>Full Name</label>
            <input type="text" id="fullName">
            <p id="nameError"></p>


            <label>Email</label>
            <input type="text" id="email">
            <p id="emailError"></p>


            <label>Program</label>
            <select id="program">
                <option value="">Select Program</option>
                <option value="BSCS">BSCS</option>
                <option value="BSSE">BSSE</option>
                <option value="BSAI">BSAI</option>
            </select>
            <p id="programError"></p>


            <label>Semester</label>
            <input type="number" id="semester">
            <p id="semesterError"></p>


            <button type="submit">Register</button>

        </form>


        <!-- Preview Card -->

        <div class="card" id="previewCard">

            <h2>Preview</h2>

            <p>
                <strong>Name:</strong>
                <span id="previewName">Your Name</span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="previewEmail">Your Email</span>
            </p>

            <p>
                <strong>Program:</strong>
                <span id="previewProgram">Your Program</span>
            </p>

            <p>
                <strong>Semester:</strong>
                <span id="previewSemester">Your Semester</span>
            </p>

        </div>


        <button id="darkButton">Dark Mode</button>


        <!-- Registered Students -->

        <h2>Registered Students</h2>

        <ul id="studentList"></ul>

    </div>


    <script src="script.js"></script>

</body>
</html>
